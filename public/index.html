<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web FPS Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=fps1">
    
    <!-- Three.js dan PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- NippleJS untuk Virtual Joystick -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

    <!-- Game UI -->
    <div id="ui-layer" style="display: none;">
        <div id="crosshair">+</div>
        <div id="health-bar">
            <div id="health-fill"></div>
        </div>
        <div id="score-board">
            Skor: <span id="my-score">0</span>
        </div>
        <div id="kill-feed"></div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" style="display: none;">
        <div id="touch-look-zone"></div>
        <div id="joystick-zone"></div>
        <button id="shoot-btn-mobile">TEMBAK</button>
    </div>

    <!-- Login Menu -->
    <div id="login-menu">
        <div class="login-box">
            <h1>NEON ARENA</h1>
            <input type="text" id="username-input" placeholder="Masukkan Username..." maxlength="12" autocomplete="off">
            <button id="join-btn">MULAI MAIN</button>
            <p class="controls-info">
                [W A S D] Bergerak &nbsp;|&nbsp; [Klik Kiri] Tembak &nbsp;|&nbsp; [Mouse] Lihat<br>
                Tekan [ESC] untuk keluar dari mode kamera.
            </p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=fps4"></script>
</body>
</html>
